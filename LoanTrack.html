<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanTrack Pro — Private Lending Portfolio</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"><\/script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"><\/script>
<style>
/* =====================================================
   CSS CUSTOM PROPERTIES — Edit colors here
   ===================================================== */
:root {
  --bg-app:      #f0f2f5;
  --bg-card:     #ffffff;
  --bg-row:      #f8f9fb;
  --text-1:      #111827;
  --text-2:      #4b5563;
  --text-3:      #9ca3af;
  --border:      #e5e7eb;
  --accent:      #2563eb;
  --accent-h:    #1d4ed8;
  --accent-bg:   #eff6ff;
  --green:       #16a34a;
  --green-bg:    #f0fdf4;
  --amber:       #d97706;
  --amber-bg:    #fffbeb;
  --red:         #dc2626;
  --red-bg:      #fef2f2;
  --shadow:      0 1px 4px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.04);
  --shadow-lg:   0 8px 24px rgba(0,0,0,.12);
  --r:           8px;
  --r-lg:        12px;
}
[data-theme="dark"] {
  --bg-app:      #0d1117;
  --bg-card:     #161b22;
  --bg-row:      #1c2230;
  --text-1:      #e6edf3;
  --text-2:      #8b949e;
  --text-3:      #484f58;
  --border:      #21262d;
  --accent:      #58a6ff;
  --accent-h:    #79bbff;
  --accent-bg:   #0d2340;
  --green:       #3fb950;
  --green-bg:    #0a2718;
  --amber:       #f0b429;
  --amber-bg:    #2d2009;
  --red:         #f85149;
  --red-bg:      #2d1212;
  --shadow:      0 1px 4px rgba(0,0,0,.4);
  --shadow-lg:   0 8px 24px rgba(0,0,0,.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg-app);
  color: var(--text-1);
  font-size: 13.5px;
  line-height: 1.55;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
  font-size: 11.5px;
  background: var(--bg-row);
  padding: 1px 5px;
  border-radius: 4px;
}

/* Layout */
.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 216px; min-width: 216px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; inset: 0 auto 0 0;
  z-index: 200;
  overflow-y: auto;
}
.brand { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
.brand-name { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: -.3px; }
.brand-sub  { font-size: 11px; color: var(--text-3); margin-top: 1px; }

.sidenav { flex: 1; padding: 10px 8px; }
.nav-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; width: 100%; border: none; background: none;
  border-radius: var(--r); cursor: pointer;
  color: var(--text-2); font-size: 13px; font-weight: 500;
  transition: background .12s, color .12s;
  margin-bottom: 1px; text-align: left;
}
.nav-btn:hover { background: var(--bg-row); color: var(--text-1); }
.nav-btn.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.nav-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.sidebar-footer { padding: 8px; border-top: 1px solid var(--border); }

/* Main */
.main { margin-left: 216px; flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 11px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.page-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
.topbar-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.content { padding: 24px; flex: 1; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: var(--r);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  border: none; transition: all .13s; white-space: nowrap;
}
.btn svg { width: 13px; height: 13px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); }
.btn-ghost { background: var(--bg-row); color: var(--text-1); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--border); }
.btn-sm { padding: 4px 9px; font-size: 11.5px; }
.btn-icon {
  padding: 5px; border-radius: var(--r); background: var(--bg-row);
  border: 1px solid var(--border); cursor: pointer; color: var(--text-2);
  display: inline-flex; align-items: center; transition: all .12s;
}
.btn-icon:hover { color: var(--text-1); background: var(--border); }

/* Cards */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.card-body  { padding: 20px; }
.card-title { font-size: 13.5px; font-weight: 700; margin-bottom: 14px; }

/* KPI Grid */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); }
.kpi-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); margin-bottom: 7px; }
.kpi-value { font-size: 21px; font-weight: 800; line-height: 1.1; color: var(--text-1); font-variant-numeric: tabular-nums; }
.kpi-sub   { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.kpi.c-accent .kpi-value { color: var(--accent); }
.kpi.c-green  .kpi-value { color: var(--green); }
.kpi.c-red    .kpi-value { color: var(--red); }
.kpi.c-amber  .kpi-value { color: var(--amber); }

/* Outstanding hero box */
.outstanding-hero {
  background: var(--accent-bg); border: 2px solid var(--accent);
  border-radius: var(--r-lg); padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.oh-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); margin-bottom: 5px; }
.oh-value { font-size: 30px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
.b-active       { background: var(--green-bg); color: var(--green); }
.b-closed       { background: var(--bg-row);   color: var(--text-3); }
.b-late         { background: var(--red-bg);   color: var(--red); }
.b-restructured { background: var(--amber-bg); color: var(--amber); }

/* Table */
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  background: var(--bg-row); padding: 9px 11px;
  text-align: left; font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .4px; color: var(--text-3);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
thead th.sort { cursor: pointer; user-select: none; }
thead th.sort:hover { color: var(--text-1); }
tbody td { padding: 9px 11px; border-bottom: 1px solid var(--border); color: var(--text-1); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg-row); }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
.num-accent { color: var(--accent); font-size: 13.5px; }
.num-green  { color: var(--green); }
tr.row-late td { background: var(--red-bg) !important; }
.tfoot-total td { font-weight: 700; background: var(--bg-row) !important; }

/* Toolbar */
.toolbar { display: flex; gap: 9px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.inp-search, .inp-select {
  padding: 7px 11px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-1); font-size: 12.5px; outline: none; font-family: inherit;
  transition: border-color .13s;
}
.inp-search { min-width: 210px; }
.inp-search:focus, .inp-select:focus { border-color: var(--accent); }
.inp-select { cursor: pointer; }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab {
  padding: 8px 15px; font-size: 12.5px; font-weight: 600;
  color: var(--text-3); border: none; background: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  cursor: pointer; transition: all .13s;
}
.tab:hover { color: var(--text-1); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Modal */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
  z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  background: var(--bg-card); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg); width: 100%; max-width: 580px;
  max-height: 92vh; overflow-y: auto; border: 1px solid var(--border);
}
.modal-head {
  padding: 18px 22px 15px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg-card); z-index: 1;
}
.modal-title { font-size: 14.5px; font-weight: 700; }
.modal-body { padding: 20px 22px; }
.modal-foot {
  padding: 14px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  position: sticky; bottom: 0; background: var(--bg-card);
}

/* Form */
.fg    { display: flex; flex-direction: column; gap: 5px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.fgrid .full { grid-column: 1 / -1; }
label  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-2); }
.inp {
  padding: 8px 10px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-1); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .13s; width: 100%;
}
.inp:focus { border-color: var(--accent); }
textarea.inp { resize: vertical; min-height: 70px; }
.form-hint { font-size: 11px; color: var(--text-3); }
.form-warn { font-size: 11.5px; color: var(--amber); background: var(--amber-bg); padding: 6px 10px; border-radius: var(--r); margin-top: 5px; }

/* Bar chart */
.bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 100px; }
.bar-col    { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.bar        { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .8; transition: opacity .15s; cursor: default; }
.bar:hover  { opacity: 1; }
.bar-lbl    { font-size: 9.5px; color: var(--text-3); white-space: nowrap; }
.bar-amt    { font-size: 9px; color: var(--text-2); }

/* Alert */
.alert { border-radius: var(--r-lg); padding: 13px 16px; margin-bottom: 18px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid; }
.alert-red   { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
.alert svg   { flex-shrink: 0; margin-top: 1px; }
.alert-body  { flex: 1; }
.alert-title { font-weight: 700; font-size: 12.5px; margin-bottom: 6px; }

/* Detail */
.detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.df-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-3); margin-bottom: 3px; }
.df-value { font-size: 13.5px; font-weight: 600; color: var(--text-1); }

/* Section */
.section-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
.section-title { font-size: 13.5px; font-weight: 700; }
.report-section { margin-bottom: 20px; }

/* Import zone */
.drop-zone { border: 2px dashed var(--border); border-radius: var(--r-lg); padding: 28px; text-align: center; cursor: pointer; transition: border-color .15s; }
.drop-zone:hover { border-color: var(--accent); }
.drop-zone p { color: var(--text-3); font-size: 12px; margin-top: 6px; }

/* Back link */
.back-link { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; background: none; padding: 0; margin-bottom: 16px; }
.back-link:hover { color: var(--text-1); }

.divider { border: none; border-top: 1px solid var(--border); margin: 15px 0; }

/* Toast */
.toast { position: fixed; bottom: 22px; right: 22px; background: var(--text-1); color: var(--bg-card); padding: 10px 16px; border-radius: var(--r); font-size: 12.5px; font-weight: 600; z-index: 999; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; pointer-events: auto; }

/* Empty state */
.empty { text-align: center; padding: 42px 20px; color: var(--text-3); }
.empty h3 { font-size: 14px; color: var(--text-2); margin-bottom: 6px; }

/* Utilities */
.nowrap { white-space: nowrap; }
.muted  { color: var(--text-3); }
.small  { font-size: 11.5px; }
.bold   { font-weight: 700; }

/* Print */
@media print {
  .sidebar, .topbar, .btn, .toolbar, .overlay, .toast { display: none !important; }
  .main { margin-left: 0 !important; }
  .content { padding: 0 !important; }
  .card { box-shadow: none !important; }
}

/* Responsive */
@media (max-width: 780px) {
  .sidebar { width: 200px; transform: translateX(-100%); transition: transform .25s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .fgrid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<script>
/* ====================================================================
   LOANTRACK PRO
   ====================================================================

   CORE FORMULA (edit calcLoan() below to change):
     Outstanding Principal  = Original Principal - SUM(principalPortion)
     Income Received        = SUM(incomePortion)
     Total Cash Received    = Principal Repaid + Income Received

   Income-only payments do NOT reduce principal.
   Mixed payments split into income + principal portions.
   Principal cannot go below zero (auto-capped).
   Loan auto-closes when outstanding reaches zero.

   ==================================================================== */

// ══════════════════════════════════════════════════════
// SAMPLE DEMO DATA — replace with your own or import CSV
// ══════════════════════════════════════════════════════
let loans = [
  { id:'L001', borrowerName:'Robert Chen',    accountNumber:'ACC-2023-001', startDate:'2023-03-15', originalPrincipal:500000, monthlyIncomeAmount:5000,  paymentDueDay:15, status:'Active',       loanTermMonths:60,  loanStructure:'interest_only',       contactInfo:'robertchen@email.com | +1 555-0101', notes:'Secured against commercial property. Reliable payer.' },
  { id:'L002', borrowerName:'Maria Santos',   accountNumber:'ACC-2023-002', startDate:'2023-06-01', originalPrincipal:200000, monthlyIncomeAmount:2000,  paymentDueDay:1,  status:'Active',       loanTermMonths:36,  loanStructure:'flexible',            contactInfo:'maria.santos@biz.com | +1 555-0202',  notes:'Business expansion loan. Pays via bank transfer.' },
  { id:'L003', borrowerName:'James Williams', accountNumber:'ACC-2023-003', startDate:'2023-09-01', originalPrincipal:150000, monthlyIncomeAmount:1875,  paymentDueDay:5,  status:'Late',         loanTermMonths:24,  loanStructure:'interest_only',       contactInfo:'+1 555-0303',                         notes:'Missed last two payments. Follow-up call needed.' },
  { id:'L004', borrowerName:'Susan Park',     accountNumber:'ACC-2022-004', startDate:'2022-01-10', originalPrincipal:100000, monthlyIncomeAmount:1000,  paymentDueDay:10, status:'Closed',       loanTermMonths:24,  loanStructure:'lump_sum_settlement',  contactInfo:'susan.park@email.com',                notes:'Loan fully repaid June 2022. Good standing borrower.' },
  { id:'L005', borrowerName:'David Okafor',   accountNumber:'ACC-2024-005', startDate:'2024-02-01', originalPrincipal:300000, monthlyIncomeAmount:3500,  paymentDueDay:1,  status:'Active',       loanTermMonths:18,  loanStructure:'reducing_balance',    contactInfo:'david.okafor@corp.com | +1 555-0505',  notes:'Real estate bridge loan. Quarterly principal payments.' },
  { id:'L006', borrowerName:'Linda Torres',   accountNumber:'ACC-2024-006', startDate:'2024-05-15', originalPrincipal:75000,  monthlyIncomeAmount:900,   paymentDueDay:15, status:'Restructured', loanTermMonths:36,  loanStructure:'flexible',            contactInfo:'linda.t@email.com',                   notes:'Restructured Oct 2024. Extended by 12 months, same rate.' },
];

let _pid = 200;
const pid = () => 'P' + (++_pid);

let payments = [
  // Robert Chen (L001)
  { id:pid(), loanId:'L001', paymentDate:'2023-04-15', amount:5000,  paymentType:'monthly_income',     incomePortion:5000,  principalPortion:0,     paymentMethod:'bank_transfer', remarks:'April income' },
  { id:pid(), loanId:'L001', paymentDate:'2023-05-15', amount:5000,  paymentType:'monthly_income',     incomePortion:5000,  principalPortion:0,     paymentMethod:'bank_transfer', remarks:'May income' },

// ══════════════════════════════════════════════════════
// CALCULATION ENGINE
// ══════════════════════════════════════════════════════
// ▶ EDIT HERE to change calculation logic
//   principalPortion  → reduces outstanding principal
//   incomePortion     → counted as income only, does NOT reduce principal
function calcLoan(loanId) {
  const loan = loans.find(l => l.id === loanId);
  if (!loan) return null;
  const ps = payments.filter(p => p.loanId === loanId);
  // Sum principal repayments only
  const principalRepaid = ps.reduce((s, p) => s + (p.principalPortion || 0), 0);
  // Sum income portions only
  const incomeReceived  = ps.reduce((s, p) => s + (p.incomePortion   || 0), 0);
  // Principal cannot go below zero
  const outstanding = Math.max(0, loan.originalPrincipal - principalRepaid);
  const totalReceived = principalRepaid + incomeReceived;
  const sorted = [...ps].sort((a, b) => b.paymentDate.localeCompare(a.paymentDate));
  return { principalRepaid, incomeReceived, outstanding, totalReceived,
           lastPayment: sorted[0]?.paymentDate || null, count: ps.length };
}

function globalStats() {
  autoClose();
  let origTotal=0, outTotal=0, repaidTotal=0, incomeTotal=0, recvTotal=0;
  loans.forEach(l => {
    const c = calcLoan(l.id);
    origTotal   += l.originalPrincipal;
    outTotal    += c.outstanding;
    repaidTotal += c.principalRepaid;
    incomeTotal += c.incomeReceived;
    recvTotal   += c.totalReceived;
  });
  const active = loans.filter(l => ['Active','Late','Restructured'].includes(l.status));
  const closed = loans.filter(l => l.status === 'Closed');
  const late   = loans.filter(l => l.status === 'Late');
  return { origTotal, outTotal, repaidTotal, incomeTotal, recvTotal,
           active: active.length, closed: closed.length, late: late.length, total: loans.length };
}

// Auto-mark Closed when outstanding = 0
function autoClose() {
  loans.forEach(l => {
    if (l.status !== 'Closed') {
      const c = calcLoan(l.id);
      if (c && c.outstanding === 0) l.status = 'Closed';
    }
  });
}

// Monthly collections for last N months
function monthlySummary(n) {
  const now = new Date();
  return Array.from({ length: n }, (_, i) => {
    const d   = new Date(now.getFullYear(), now.getMonth() - (n - 1 - i), 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const lbl = d.toLocaleString('default', { month: 'short', year: '2-digit' });
    const ps  = payments.filter(p => p.paymentDate.startsWith(key));
    return {
      key, lbl,
      total:     ps.reduce((s, p) => s + p.amount,                0),
      income:    ps.reduce((s, p) => s + (p.incomePortion   || 0), 0),
      principal: ps.reduce((s, p) => s + (p.principalPortion || 0), 0),
      count: ps.length,
    };
  });
}

function go(v, loanId) {
  if (loanId && loanId !== curLoan) detailTab = 'overview';
  curView = v;
  curLoan = loanId || null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nb-' + (v === 'detail' ? 'loans' : v));
  if (nb) nb.classList.add('active');
  const titles = { dashboard:'Dashboard', loans:'Borrowers & Loans', detail:'Loan Detail', reports:'Reports', import:'Import & Export' };
  document.getElementById('page-title').textContent = titles[v] || v;
  autoClose();
  render();
}

function render() {
  const el = document.getElementById('content');
  if (curView === 'dashboard') el.innerHTML = vDashboard();
  else if (curView === 'loans')  el.innerHTML = vLoanList();
  else if (curView === 'detail') el.innerHTML = vDetail(curLoan);
  else if (curView === 'reports')el.innerHTML = vReports();
  else if (curView === 'import') el.innerHTML = vImport();
}

            : list.map(l => {

                return `<tr class="${l.status === 'Late' ? 'row-late' : ''}">
                  <td><a href="#" onclick="go('detail','${l.id}');return false" style="font-weight:700">${l.borrowerName}</a></td>
                  <td class="muted small">${l.accountNumber}</td>
                  <td>${lsBadge(l.loanStructure)}</td>
                  <td class="nowrap">${dtFmt(l.startDate)}</td>
                  <td class="num">${fmt$(l.originalPrincipal)}</td>
                  <td class="num num-green">${fmt$(c.principalRepaid)}</td>
                  <td class="num num-accent">${fmt$(c.outstanding)}</td>
                  <td class="num">${fmt$(l.monthlyIncomeAmount)}</td>
                  <td class="num num-green">${fmt$(c.incomeReceived)}</td>
                  <td class="num">${fmt$(c.totalReceived)}</td>
                  <td class="nowrap muted small">${dtFmt(c.lastPayment)}</td>
                  <td>${badge(l.status)}</td>
                  <td style="white-space:nowrap">
                    <button class="btn btn-ghost btn-sm" onclick="go('detail','${l.id}')">View</button>
                    <button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red);margin-left:4px" onclick="deleteLoan('${l.id}')">Delete</button>
                  </td>
                </tr>`;
              }).join('')
          }
        </tbody>
      </table>
    </div>
  </div>`;
}

function srt(f) {
  if (sortBy === f) sortAsc = !sortAsc; else { sortBy = f; sortAsc = true; }
  render();
}

function vDetail(lid) {
  const loan = loans.find(l => l.id === lid);
  if (!loan) return '<div class="empty"><h3>Loan not found.</h3></div>';
  const c   = calcLoan(lid);
  const ps  = [...payments.filter(p => p.loanId === lid)].sort((a,b) => b.paymentDate.localeCompare(a.paymentDate));
  const pct = loan.originalPrincipal > 0 ? ((c.principalRepaid / loan.originalPrincipal) * 100).toFixed(1) : 0;

  return `
  <button class="back-link" onclick="go('loans')">
    <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
    Back to Loans
  </button>

  <!-- ★ The most important number — Current Outstanding Principal -->
  <div class="outstanding-hero">
    <div>
      <div class="oh-label">Current Outstanding Principal</div>
      <div class="oh-value">${fmt$(c.outstanding)}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div>${badge(loan.status)}</div>
      <div style="display:flex;gap:7px">
        <button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red)" onclick="deleteLoan('${loan.id}')">Delete Loan</button>
        <button class="btn btn-ghost btn-sm" onclick="openLoanModal('${loan.id}')">Edit Loan</button>
        <button class="btn btn-primary btn-sm" onclick="openPaymentModal('${loan.id}')">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
          Add Payment
        </button>
      </div>
    </div>
  </div>

  <div class="kpi-grid" style="margin-bottom:20px">
    <div class="kpi"><div class="kpi-label">Original Principal</div><div class="kpi-value">${fmt$(loan.originalPrincipal)}</div></div>
    <div class="kpi c-green">
      <div class="kpi-label">Principal Repaid</div>
      <div class="kpi-value">${fmt$(c.principalRepaid)}</div>
      <div class="kpi-sub">${pct}% of original</div>
    </div>
    <div class="kpi c-accent">
      <div class="kpi-label">Income Received</div>
      <div class="kpi-value">${fmt$(c.incomeReceived)}</div>
      <div class="kpi-sub">Does not reduce principal</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total Cash Received</div>
      <div class="kpi-value">${fmt$(c.totalReceived)}</div>
      <div class="kpi-sub">Income + principal</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Monthly Income Expected</div>
      <div class="kpi-value">${fmt$(loan.monthlyIncomeAmount)}</div>
      <div class="kpi-sub">Due day ${loan.paymentDueDay}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Payments Recorded</div>
      <div class="kpi-value">${c.count}</div>
      <div class="kpi-sub">Last: ${dtFmt(c.lastPayment)}</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab ${detailTab==='overview' ?'active':''}" onclick="detailTab='overview';render()">Loan Info</button>
    <button class="tab ${detailTab==='payments' ?'active':''}" onclick="detailTab='payments';render()">Payment History (${ps.length})</button>
    <button class="tab ${detailTab==='balance'  ?'active':''}" onclick="detailTab='balance';render()">Running Balance</button>
  </div>

  ${detailTab === 'overview' ? vLoanInfo(loan)          : ''}
  ${detailTab === 'payments' ? vPaymentTable(ps, lid)   : ''}
  ${detailTab === 'balance'  ? vRunningBalance(loan)    : ''}`;
}

// ▶ Loan structure metadata — edit labels/colors/descriptions here
const LS_META = {
  interest_only:       { label:'Interest Only',            color:'var(--green)',  bg:'var(--green-bg)',  desc:'Borrower pays interest monthly. Principal stays unchanged until settlement.' },
  reducing_balance:    { label:'Monthly Reducing Balance',  color:'var(--accent)', bg:'var(--accent-bg)', desc:'Regular monthly payments reduce the outstanding principal balance.' },
  lump_sum_settlement: { label:'Lump Sum Settlement',       color:'#7c3aed',       bg:'#f5f3ff',          desc:'Principal is cleared by one or more large lump sum payments.' },
  flexible:            { label:'Flexible / Mixed',          color:'var(--amber)',  bg:'var(--amber-bg)',  desc:'Combination — interest payments plus occasional principal reductions.' },
};
function lsBadge(s) {
  const m = LS_META[s] || { label: s || 'Not Set', color:'var(--text-3)', bg:'var(--bg-row)' };
  return `<span class="badge" style="background:${m.bg};color:${m.color}">${m.label}</span>`;
}

function vPaymentTable(ps, lid) {

function vRunningBalance(loan) {
  const ps = [...payments.filter(p => p.loanId === loan.id)]
    .sort((a, b) => a.paymentDate.localeCompare(b.paymentDate));
  let bal = loan.originalPrincipal;
  return `
  <div class="card" style="padding:0;overflow:hidden">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Date</th><th>Event</th>
          <th>Income</th><th>Principal Paid</th><th>Principal Balance</th>
        </tr></thead>
        <tbody>
          <tr>
            <td class="muted small">—</td>
            <td class="nowrap">${dtFmt(loan.startDate)}</td>
            <td><strong>Loan Originated</strong></td>
            <td>—</td><td>—</td>
            <td class="num num-accent">${fmt$(bal)}</td>
          </tr>
          ${ps.map((p, i) => {
            bal = Math.max(0, bal - (p.principalPortion || 0));
            return `<tr>
              <td class="muted small">${i + 1}</td>
              <td class="nowrap">${dtFmt(p.paymentDate)}</td>
              <td>
                <span style="color:${ptColor(p.paymentType)};font-weight:700;font-size:11px">${ptLabel(p.paymentType)}</span>
                ${p.remarks ? ` <span class="muted small">— ${p.remarks}</span>` : ''}
              </td>
              <td class="num num-green">${p.incomePortion    ? fmt$(p.incomePortion)    : '<span class="muted">—</span>'}</td>
              <td class="num" style="color:var(--accent)">${p.principalPortion ? fmt$(p.principalPortion) : '<span class="muted">—</span>'}</td>
              <td class="num num-accent bold">${fmt$(bal)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function saveLoan(editId) {
  const g = id => document.getElementById(id)?.value?.trim();
  const name      = g('lf-name');
  const acc       = g('lf-acc');
  const date      = g('lf-date');
  const principal = parseFloat(g('lf-principal'));
  if (!name || !acc || !date || isNaN(principal)) {
    toast('Please complete all required fields (*).', 'err'); return;
  }
  if (editId) {
    const l = loans.find(x => x.id === editId);
    l.borrowerName        = name;
    l.accountNumber       = acc;
    l.startDate           = date;
    l.originalPrincipal   = principal;
    l.monthlyIncomeAmount = parseFloat(g('lf-income'))  || 0;
    l.paymentDueDay       = parseInt(g('lf-dueday'))    || 1;
    l.loanTermMonths      = parseInt(g('lf-term'))      || null;
    l.status              = g('lf-status');
    l.loanStructure       = g('lf-structure') || 'interest_only';
    l.contactInfo         = g('lf-contact');
    l.notes               = g('lf-notes');
    toast('Loan updated.');
  } else {
    const newId = g('lf-id') || pid();
    if (loans.find(l => l.id === newId)) { toast('That Loan ID already exists.', 'err'); return; }
    loans.push({
      id: newId, borrowerName: name, accountNumber: acc, startDate: date,
      originalPrincipal: principal,
      monthlyIncomeAmount: parseFloat(g('lf-income')) || 0,
      paymentDueDay:       parseInt(g('lf-dueday'))   || 1,
      loanTermMonths:      parseInt(g('lf-term'))      || null,
      status:              g('lf-status')    || 'Active',
      loanStructure:       g('lf-structure') || 'interest_only',
      contactInfo:         g('lf-contact'), notes: g('lf-notes'),
    });
    toast('Loan created.');
  }
  closeModal(); autoClose(); saveToStorage(); render();
}

function onTypeChange() {
  const type  = document.getElementById('pf-type')?.value;
  const amt   = parseFloat(document.getElementById('pf-amt')?.value) || 0;
  const incEl = document.getElementById('pf-inc');
  const priEl = document.getElementById('pf-pri');
  const hint  = document.getElementById('pf-type-hint');
  if (!incEl || !priEl) return;

  // Update contextual hint
  if (hint) {
    const meta = PT_META[type];
    const hintStyles = {
      monthly_income:     'background:var(--green-bg);color:var(--green)',
      principal_repayment:'background:var(--accent-bg);color:var(--accent)',
      lump_sum:           'background:#f5f3ff;color:#7c3aed',
      mixed:              'background:var(--amber-bg);color:var(--amber)',
    };
    hint.style.cssText = 'font-size:11.5px;padding:6px 10px;border-radius:var(--r);margin-top:2px;' + (hintStyles[type] || '');
    hint.textContent = meta ? '→ ' + meta.desc : '';
  }

  // Auto-fill income/principal split based on type
  const principalTypes = ['principal_repayment', 'lump_sum'];
  if (type === 'monthly_income') {
    incEl.value = amt || ''; incEl.readOnly = true;
    priEl.value = 0;         priEl.readOnly = true;
  } else if (principalTypes.includes(type)) {
    priEl.value = amt || ''; priEl.readOnly = true;
    incEl.value = 0;         incEl.readOnly = true;
  } else {
    // mixed — user sets both
    incEl.readOnly = false; priEl.readOnly = false;
  }
  chkSplit();
}

function onAmtChange() {
  const type  = document.getElementById('pf-type')?.value;
  const amt   = parseFloat(document.getElementById('pf-amt')?.value) || 0;
  const incEl = document.getElementById('pf-inc');
  const priEl = document.getElementById('pf-pri');
  if (!incEl || !priEl) return;
  if      (type === 'monthly_income')                           { incEl.value = amt; priEl.value = 0; }
  else if (type === 'principal_repayment' || type === 'lump_sum') { priEl.value = amt; incEl.value = 0; }
  chkSplit();
}

function chkSplit() {
  const type = document.getElementById('pf-type')?.value;
  const wEl  = document.getElementById('split-warn');
  if (!wEl || type !== 'mixed') { if (wEl) wEl.style.display = 'none'; return; }
  const amt = parseFloat(document.getElementById('pf-amt')?.value) || 0;
  const inc = parseFloat(document.getElementById('pf-inc')?.value) || 0;
  const pri = parseFloat(document.getElementById('pf-pri')?.value) || 0;
  if (Math.abs(amt - inc - pri) > 0.01) {
    wEl.style.display = 'block';
    wEl.innerHTML = `<div class="form-warn">⚠ Split mismatch: ${fmt$(inc)} + ${fmt$(pri)} = ${fmt$(inc + pri)}, but total is ${fmt$(amt)}</div>`;
  } else {
    wEl.style.display = 'none';
  }
}

function savePayment(lid) {
  const g   = id => document.getElementById(id)?.value;
  const date = g('pf-date');
  const amt  = parseFloat(g('pf-amt'));
  const type = g('pf-type');
  const inc  = parseFloat(g('pf-inc')) || 0;
  const pri  = parseFloat(g('pf-pri')) || 0;

  if (!date || isNaN(amt) || amt <= 0) { toast('Please enter a date and amount.', 'err'); return; }
  if (type === 'mixed' && Math.abs(amt - inc - pri) > 0.01) {
    toast('Fix split before saving — income + principal must equal total amount.', 'err'); return;
  }
  // Cap principal so balance never goes negative
  const outstanding = calcLoan(lid).outstanding;
  const cappedPri   = Math.min(pri, outstanding);
  if (cappedPri < pri) toast('Principal capped at current outstanding: ' + fmt$(outstanding), 'warn');

  payments.push({
    id: pid(), loanId: lid, paymentDate: date, amount: amt, paymentType: type,
    incomePortion:    (type === 'principal_repayment' || type === 'lump_sum') ? 0 : inc,
    principalPortion: cappedPri,
    paymentMethod:    g('pf-method') || 'cash',
    remarks:          g('pf-rem') || '',
  });
  autoClose(); closeModal(); saveToStorage(); toast('Payment recorded.'); render();
}

function deleteLoan(lid) {
  const loan = loans.find(l => l.id === lid);
  if (!loan) return;
  const payCount = payments.filter(p => p.loanId === lid).length;
  const msg = `Delete loan for "${loan.borrowerName}" (${loan.accountNumber})?\n\n` +
              `This will also permanently delete ${payCount} payment record${payCount !== 1 ? 's' : ''} linked to this loan.\n\nThis cannot be undone.`;
  if (!confirm(msg)) return;
  loans    = loans.filter(l => l.id !== lid);
  payments = payments.filter(p => p.loanId !== lid);
  saveToStorage();
  toast('Loan and ' + payCount + ' payment' + (payCount !== 1 ? 's' : '') + ' deleted.');
  // If we were on the detail page for this loan, go back to the list
  if (curView === 'detail' && curLoan === lid) go('loans');
  else render();
}

function delPayment(payId, lid) {
  if (!confirm('Delete this payment? Balances will be recalculated.')) return;
  payments = payments.filter(p => p.id !== payId);
  autoClose(); saveToStorage(); toast('Payment deleted.'); render();
}

// ▶ COLUMN MAPPINGS are defined by the header arrays in expLoans() / expPayments()
//   Adjust them to match your Google Sheets column names if needed.
function csvEsc(v) {
  const s = String(v === null || v === undefined ? '' : v);
  return (s.includes(',') || s.includes('"') || s.includes('\n'))
    ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function mkCSV(headers, rows) {
  return [headers.join(','), ...rows.map(r => r.map(csvEsc).join(','))].join('\n');
}
function dlCSV(content, name) {
  const a = document.createElement('a');
  a.href     = URL.createObjectURL(new Blob([content], { type: 'text/csv;charset=utf-8;' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Downloaded ' + name);
}

function expLoans() {
  // ▶ Edit this header array to change export column order / names
  const h = ['id','borrowerName','accountNumber','startDate','originalPrincipal',
             'monthlyIncomeAmount','paymentDueDay','status','loanStructure','notes','contactInfo','loanTermMonths'];
  dlCSV(mkCSV(h, loans.map(l => h.map(k => l[k] !== undefined ? l[k] : ''))), 'loans_export.csv');
}

function expPayments() {
  // ▶ Edit this header array to change export column order / names
  const h = ['id','loanId','paymentDate','amount','paymentType',
             'incomePortion','principalPortion','paymentMethod','remarks'];
  dlCSV(mkCSV(h, payments.map(p => h.map(k => p[k] !== undefined ? p[k] : ''))), 'payments_export.csv');
}

L001,2024-08-15,27500,mixed,2500,25000,bank_transfer,Mixed: interest + partial principal repayment`, 'payments_template.csv');
  }

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = []; let inQ = false, cur = '';
    for (const ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').replace(/^"|"$/g, ''));
    return obj;
  });
}

function importLoans(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      let n = 0;
      rows.forEach(row => {
        if (!row.borrowerName || !row.startDate) return;
        const data = {
          id:                  row.id || pid(),
          borrowerName:        row.borrowerName,
          accountNumber:       row.accountNumber  || '',
          startDate:           row.startDate,
          originalPrincipal:   parseFloat(row.originalPrincipal)   || 0,
          monthlyIncomeAmount: parseFloat(row.monthlyIncomeAmount)  || 0,
          paymentDueDay:       parseInt(row.paymentDueDay)          || 1,
          status:              row.status         || 'Active',
          notes:               row.notes          || '',
          contactInfo:         row.contactInfo    || '',
          loanTermMonths:      row.loanTermMonths  ? parseInt(row.loanTermMonths) : null,
          loanStructure:       row.loanStructure   || 'interest_only',
        };
        const ex = loans.find(l => l.id === data.id);
        if (ex) Object.assign(ex, data); else loans.push(data);
        n++;
      });
      autoClose();
      saveToStorage();
      toast('Imported ' + n + ' loan' + (n !== 1 ? 's' : '') + '.');
      render();
    } catch (err) { toast('CSV parse error: ' + err.message, 'err'); }
    inp.value = '';
  };
  r.readAsText(f);
}

function importPayments(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      let n = 0;
      rows.forEach(row => {
        if (!row.loanId || !row.paymentDate) return;
        payments.push({
          id:               row.id || pid(),
          loanId:           row.loanId,
          paymentDate:      row.paymentDate,
          amount:           parseFloat(row.amount)           || 0,
          paymentType:      row.paymentType                  || 'monthly_income',
          incomePortion:    parseFloat(row.incomePortion)    || 0,
          principalPortion: parseFloat(row.principalPortion) || 0,
          paymentMethod:    row.paymentMethod                || 'cash',
          remarks:          row.remarks                      || '',
        });
        n++;
      });
      autoClose();

      toast('Imported ' + n + ' payment' + (n !== 1 ? 's' : '') + '.');

    } catch (err) { toast('CSV parse error: ' + err.message, 'err'); }

  r.readAsText(f);
}

const MOON_SVG = '<path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>';

function toggleTheme() {
  darkMode = !darkMode;
  document.body.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  document.getElementById('theme-icon').innerHTML = darkMode ? SUN_SVG : MOON_SVG;
  document.getElementById('theme-lbl').textContent = darkMode ? 'Light Mode' : 'Dark Mode';
}

// ══════════════════════════════════════════════════════
// TOAST NOTIFICATIONS
// ══════════════════════════════════════════════════════
let _tt;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'err' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--text-1)';
  el.classList.add('on');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('on'), 3200);
}

// ══════════════════════════════════════════════════════
// LOCAL STORAGE — persistent database
// ══════════════════════════════════════════════════════
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyD_DUMMY_KEY_NOT_NEEDED_FOR_RTDB",
  projectId: "loantrack-56980",
  databaseURL: "https://loantrack-56980-default-rtdb.asia-southeast1.firebasedatabase.app",
  authDomain: "loantrack-56980.firebaseapp.com",
  storageBucket: "loantrack-56980.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};

let fbApp, fbDb, fbLoansRef, fbPaymentsRef;
let isFirebaseReady = false;
let isSyncingFromFb = false;

function initFirebase() {
  try {
    fbApp = firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database(fbApp);
    fbLoansRef = fbDb.ref('loans');
    fbPaymentsRef = fbDb.ref('payments');

    // Monitor connection status
    const connectedRef = fbDb.ref('.info/connected');
    connectedRef.on('value', (snap) => {
      if (snap.val() === true) {
        isFirebaseReady = true;
        const lbl = document.getElementById('save-lbl');
        if (lbl) lbl.textContent = '☁️ Cloud synced';
      } else {
        const lbl = document.getElementById('save-lbl');
        if (lbl) lbl.textContent = '⚠️ Offline mode';
      }
    });

    // Listen for loans changes
    fbLoansRef.on('value', (snap) => {
      if (isSyncingFromFb) return;
      isSyncingFromFb = true;
      const data = snap.val();
      if (data) loans = Object.values(data);
      isSyncingFromFb = false;
      updateSaveIndicator(new Date().toISOString());
      render();
    });

    // Listen for payments changes
    fbPaymentsRef.on('value', (snap) => {
      if (isSyncingFromFb) return;
      isSyncingFromFb = true;
      const data = snap.val();
      if (data) payments = Object.values(data);
      isSyncingFromFb = false;
      updateSaveIndicator(new Date().toISOString());
      render();
    });

    isFirebaseReady = true;
  } catch (e) {
    console.error('Firebase init failed:', e);
    toast('Firebase connection failed. Working offline.', 'warn');
  }
}

function saveToStorage() {
  try {
    if (!isFirebaseReady) return;
    isSyncingFromFb = true;

    // Save loans
    const loansObj = {};
    loans.forEach(l => loansObj[l.id] = l);
    fbLoansRef.set(loansObj);

    // Save payments
    const paymentsObj = {};
    payments.forEach(p => paymentsObj[p.id] = p);
    fbPaymentsRef.set(paymentsObj);

    updateSaveIndicator(new Date().toISOString());
    isSyncingFromFb = false;
  } catch (e) {
    isSyncingFromFb = false;
    console.error('Firebase save failed:', e);
    toast('Sync failed. Check your connection.', 'err');
  }
}

function loadFromStorage() {
  // Firebase is loaded via real-time listeners in initFirebase()
  return true;
}

function clearStorage() {
  if (!confirm('Clear ALL saved data and reload demo data?\n\nThis will clear Firebase AND reload.')) return;
  try {
    fbLoansRef.set(null);
    fbPaymentsRef.set(null);
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    toast('Clear failed: ' + e.message, 'err');
  }
}

function manualSave() {
  saveToStorage();
  toast('Data synced to cloud.');
}

function updateSaveIndicator(isoDate) {
  const lbl  = document.getElementById('save-lbl');
  const icon = document.getElementById('save-icon');
  if (!lbl) return;
  if (!isoDate) { lbl.textContent = 'No data saved yet'; return; }
  const d = new Date(isoDate);
  const timeStr = d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) +
                  ' ' + d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
  lbl.textContent = 'Saved ' + timeStr;
  if (icon) icon.style.color = 'var(--green)';
}

// ══════════════════════════════════════════════════════
// INIT — Initialize Firebase and load data
// ══════════════════════════════════════════════════════
initFirebase();

// Give Firebase a moment to load data from cloud
setTimeout(() => {
  // If Firebase is empty, seed with demo data
  if (loans.length === 0 && payments.length === 0) {
    saveToStorage();
  }
  autoClose();
  render();
}, 500);
</script>
